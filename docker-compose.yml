version: '3.8'

services:
  nexusnight:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusnight
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      # Media library (read-only for security)
      - ${MEDIA_PATH:-./media}:/app/media:ro
      # Data directory (read-write for database, cache, thumbnails)
      - ${DATA_PATH:-./data}:/app/data
      # Environment file
      - .env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MEDIA_PATH=/app/media
      - DATA_PATH=/app/data
    networks:
      - nexusnight-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  nexusnight-network:
    driver: bridge
